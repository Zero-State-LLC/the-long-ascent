<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="THE LONG ASCENT — walk the line. Seventeen eras, six resources, one way forward." />
  <title>THE LONG ASCENT</title>
  <link rel="stylesheet" href="./styles.css?v=f795103" />
</head>
<body data-view="game">
  <!-- v9 THE CLEARING: fixed chrome bands (D3) own all persistent UI. -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <header id="chrome-top" class="chrome-top"></header>

  <!-- v6 HUD: thin top resource strip, purple-bar language, no /s chips -->
  <aside id="resource-bar" aria-label="Resources"></aside>

  <main id="stage">
    <canvas id="world-canvas" width="1280" height="720" tabindex="0"
            aria-label="The long ascent: walk right, jump, read the stones"></canvas>
  </main>

  <footer id="chrome-bottom" class="chrome-bottom"></footer>

  <section id="settings-screen" hidden>
    <h2>Settings</h2>
    <div id="settings-form"></div>
  </section>

  <nav id="nav-rail" aria-label="Views">
    <button type="button" data-view="settings">Settings</button>
  </nav>

  <div id="toast" role="status" aria-live="polite" hidden></div>

<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push("E:"+String(e.message))});window.addEventListener("unhandledrejection",function(e){window.__errs.push("R:"+String(e.reason))});(function(){var ce=console.error;console.error=function(){window.__errs.push("C:"+Array.from(arguments).join(" "));ce.apply(console,arguments)}})();</script>
  <script type="module" src="./src/main.js?v=f795103"></script>
<div id="build-tag" style="position:fixed;bottom:4px;right:8px;font-size:10px;opacity:.35;color:#aab7d0;font-family:monospace">build f40e931</div></body>
</html>
