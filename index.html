<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="THE LONG ASCENT — walk the line. Seventeen eras, six resources, one way forward." />
  <title>THE LONG ASCENT</title>
  <link rel="stylesheet" href="./styles.css?v=5a076e1" />
</head>
<body data-view="game">
  <!-- v6: the world is the canvas; idle/quiz DOM views are retired (SPEC §5). -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <header id="era-header">
    <h1 id="era-title">ERA 1 — THE CAVE</h1>
    <p id="era-sub"></p>
    <div id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Walk to the era boundary">
      <div id="progress-fill"></div>
    </div>
  </header>

  <!-- v6 HUD: thin top resource strip, purple-bar language, no /s chips -->
  <aside id="resource-bar" aria-label="Resources"></aside>

  <main id="stage">
    <canvas id="world-canvas" width="1280" height="720" tabindex="0"
            aria-label="The long ascent: walk right, jump, read the stones"></canvas>
    <!-- in-world overlays, anchored above their objects by scroller-boot -->
    <div id="world-prompt" hidden></div>
    <div id="world-menu" hidden></div>
  </main>

  <footer id="controls-hint">
    ← → / A D walk · ↑ / W / Space jump (hold = higher) · ↓ / E interact · Esc close menu
  </footer>

  <section id="settings-screen" hidden>
    <h2>Settings</h2>
    <div id="settings-form"></div>
  </section>

  <nav id="nav-rail" aria-label="Views">
    <button type="button" data-view="settings">Settings</button>
  </nav>

  <div id="toast" role="status" aria-live="polite" hidden></div>

<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(String(e.message||e))});window.addEventListener("unhandledrejection",function(e){window.__errs.push("rej:"+String(e.reason))});</script>
  <script type="module" src="./src/main.js?v=5a076e1"></script>
<div id="build-tag" style="position:fixed;bottom:4px;right:8px;font-size:10px;opacity:.35;color:#aab7d0;font-family:monospace">build 57e3216</div></body>
</html>
